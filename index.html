<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOLF STORE HACK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">狼</span><span>WOLF <b>STORE</b></span></div>
    <nav aria-label="القائمة الرئيسية">
      <a class="active" href="index.html">⌂ الرئيسية</a>
      <a href="#games">🎮 الألعاب</a>
      <a href="#services">⚙ الخدمات</a>
      <a href="#about">ⓘ معلومات</a>
    </nav>
  </header>

  <main class="hero">
    <div class="hero-content">
      <div class="eyebrow">WOLF STORE · PLAYSTATION</div>
      <h1>شكراً لاختيارك <span>WOLF STORE</span></h1>
      <p class="subtitle">جاري تجهيز GoldHEN لتشغيل الألعاب</p>
      <section class="status-panel" aria-live="polite">
        <div class="loader" aria-hidden="true"></div>
        <h2 id="msgs">انتظر للتشغيل...</h2>
        <p class="status-hint" id="statusHint">يرجى عدم إغلاق المتصفح أثناء عملية التشغيل</p>
      </section>
      <div class="gold-line"></div>
      <p class="fw-note">PlayStation 4 · GoldHEN</p>
    </div>
  </main>

  <footer class="footer">
    <span>◆ WOLF STORE</span>
    <span>الفيوم · مصر</span>
  </footer>

<script>
(function () {
  const msgs = document.getElementById("msgs");
  const panel = document.querySelector(".status-panel");
  const loader = document.querySelector(".loader");
  const hint = document.getElementById("statusHint");
  if (!msgs || !panel) return;

  function updateStatus() {
    const value = (msgs.textContent || "").toLowerCase();
    panel.classList.remove("status-success", "status-failed", "status-waiting");

    if (/failed|error|فشل|خطأ|not found|unsupported firmware|no offsets/.test(value)) {
      panel.classList.add("status-failed");
      loader.textContent = "✕";
      loader.setAttribute("aria-label", "فشل التشغيل");
      hint.textContent = "تعذر تشغيل GoldHEN. راجع الرسالة أو أعد تشغيل الجهاز.";
    } else if (/goldhen.*loaded|already loaded|تم التشغيل|نجح التشغيل/.test(value)) {
      panel.classList.add("status-success");
      loader.textContent = "✓";
      loader.setAttribute("aria-label", "تم التشغيل بنجاح");
      hint.textContent = "تم تحميل GoldHEN بنجاح.";
    } else {
      panel.classList.add("status-waiting");
      loader.textContent = "";
      loader.removeAttribute("aria-label");
      hint.textContent = "يرجى الانتظار حتى تظهر نتيجة التشغيل.";
    }
  }

  updateStatus();
  new MutationObserver(updateStatus).observe(msgs, {
    childList: true, characterData: true, subtree: true
  });
})();
</script>
</body>
</html>
