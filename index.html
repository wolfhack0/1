<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOLF STORE HACK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="wolf-mark">W</span><span>WOLF <b>STORE</b></span></a>
  <nav>
    <a class="active" href="index.html">⌂ الرئيسية</a>
    <a href="games/index.html">🎮 الألعاب</a>
    <a href="services/index.html">⚙ الخدمات</a>
    <a href="info/index.html">ⓘ معلومات</a>
  </nav>
</header>
<main class="hero">
  <div class="hero-card">
    <div class="eyebrow">PLAYSTATION 4 · WOLF STORE</div>
    <h1>شكراً لاختيارك <span>WOLF STORE</span></h1>
    <p class="subtitle">جاري تجهيز GoldHEN لتشغيل الألعاب</p>
    <section class="status-panel" aria-live="polite">
      <h2 id="msgs">انتظر للتشغيل...</h2>
      <p id="statusHint">يرجى الانتظار حتى اكتمال عملية التشغيل</p>
    </section>
    <div class="gold-rule"></div>
    <p class="small-note">لا تغلق المتصفح أثناء التشغيل</p>
  </div>
</main>
<footer class="footer"><span>WOLF STORE</span><span>الفيوم · مصر</span></footer>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.00";
    });
} else {
    if (!window.applicationCache || window.applicationCache.status == 0 || window.applicationCache.status == 5) {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
		else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<script>
(function(){
 const el=document.getElementById('msgs');
 if(!el)return;
 function check(){
   const t=(el.textContent||'').toLowerCase();
   el.classList.remove('status-success','status-failed');
   if(/failed|error|فشل|خطأ|not found|unsupported firmware|no offsets/.test(t)){
     el.classList.add('status-failed');
     document.getElementById('statusHint').textContent='تعذر التشغيل. راجع رسالة الخطأ وحاول مرة أخرى.';
   } else if(/goldhen.*loaded|loaded successfully|success|نجح|تم التشغيل/.test(t)){
     el.classList.add('status-success');
     document.getElementById('statusHint').textContent='تم تحميل GoldHEN بنجاح.';
   } else {
     document.getElementById('statusHint').textContent='يرجى الانتظار حتى اكتمال عملية التشغيل.';
   }
 }
 check();
 new MutationObserver(check).observe(el,{childList:true,characterData:true,subtree:true});
})();
</script>
</body></html>
